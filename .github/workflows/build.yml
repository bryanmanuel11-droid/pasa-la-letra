name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Revisar Android SDK (ya viene instalado en GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Descargar fuentes (Bricolage Grotesque y DM Sans)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/fetch-fonts.sh || echo "Sin fuentes, la app usará la letra del sistema"

      - name: Compilar la APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Renombrar
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/release/app-release.apk "salida/PasaLaLetra-1.0.${{ github.run_number }}.apk"

      - name: Guardar la APK
        uses: actions/upload-artifact@v4
        with:
          name: PasaLaLetra-apk
          path: salida/*.apk

      - name: Publicar para descargar en el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pasa la Letra 1.0.${{ github.run_number }}
          body: |
            Descarga el archivo .apk de abajo desde tu celular e instálalo.
            Si Android pregunta, permite instalar apps de esta fuente.
          files: salida/*.apk
          make_latest: true
